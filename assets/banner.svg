<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#09111e" />
    </linearGradient>
    <linearGradient id="globe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#48cae4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0077b6" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="50%" stop-color="#00bbf9" />
      <stop offset="100%" stop-color="#f15bb5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
      .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #90e0ef; }
      .tag { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #00f5d4; letter-spacing: 2px; }
      .orbit { animation: spin 25s linear infinite; transform-origin: 950px 180px; }
      .orbit-reverse { animation: spin-reverse 35s linear infinite; transform-origin: 950px 180px; }
      .pulse-node { animation: pulse 3s ease-in-out infinite alternate; }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes spin-reverse { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }
      @keyframes pulse { 0% { opacity: 0.3; transform: scale(0.98); } 100% { opacity: 0.9; transform: scale(1.02); } }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bg)" rx="16" />

  <!-- Grid overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1200" height="360" fill="url(#grid)" />
  </g>

  <!-- Dynamic Earth & Orbit Visuals (Background Graphics) -->
  <g class="pulse-node">
    <circle cx="950" cy="180" r="110" fill="url(#globe)" />
    <circle cx="950" cy="180" r="110" stroke="#48cae4" stroke-width="1.5" fill="none" opacity="0.6" />
    <!-- Lat/Long lines -->
    <ellipse cx="950" cy="180" rx="110" ry="40" fill="none" stroke="#90e0ef" stroke-width="1" opacity="0.4" />
    <ellipse cx="950" cy="180" rx="50" ry="110" fill="none" stroke="#90e0ef" stroke-width="1" opacity="0.4" />
  </g>

  <!-- Orbiting Satellites and Scanning Rays -->
  <g class="orbit">
    <ellipse cx="950" cy="180" rx="140" ry="60" fill="none" stroke="#00f5d4" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.7" />
    <circle cx="1090" cy="180" r="6" fill="#00f5d4" filter="url(#glow)" />
    <!-- Satellite Icon -->
    <rect x="1082" y="174" width="16" height="12" fill="#ffffff" rx="2" />
    <line x1="1074" y1="180" x2="1082" y2="180" stroke="#00f5d4" stroke-width="2" />
    <line x1="1098" y1="180" x2="1106" y2="180" stroke="#00f5d4" stroke-width="2" />
  </g>

  <g class="orbit-reverse">
    <ellipse cx="950" cy="180" rx="160" ry="90" fill="none" stroke="#f15bb5" stroke-width="1" stroke-dasharray="4 8" opacity="0.5" />
    <circle cx="790" cy="180" r="5" fill="#f15bb5" filter="url(#glow)" />
  </g>

  <!-- Foreground Content: Text and Header Badges -->
  <g transform="translate(70, 0)">
    <!-- Tag -->
    <text x="0" y="85" class="tag">EARTH OBSERVATION &amp; GEOSPATIAL INTELLIGENCE</text>
    
    <!-- Accent Line -->
    <rect x="0" y="98" width="80" height="4" fill="url(#accent)" rx="2" />

    <!-- Title -->
    <text x="0" y="155" class="title">Awesome Earth Observation</text>
    <text x="0" y="205" class="title" fill="#00bbf9">Analytics Ecosystem 🛰️</text>

    <!-- Subtitle -->
    <text x="0" y="252" class="subtitle">Curated SaaS Platforms, AI Engines &amp; Open-Source Pipelines</text>
    
    <!-- Stats / Badges preview -->
    <g transform="translate(0, 275)">
      <rect x="0" y="0" width="130" height="28" rx="14" fill="#1f2d42" stroke="#00f5d4" stroke-width="1" />
      <text x="65" y="18" font-family="sans-serif" font-size="12" fill="#00f5d4" font-weight="bold" text-anchor="middle">📡 SAT-IMAGERY</text>

      <rect x="142" y="0" width="130" height="28" rx="14" fill="#1f2d42" stroke="#00bbf9" stroke-width="1" />
      <text x="207" y="18" font-family="sans-serif" font-size="12" fill="#00bbf9" font-weight="bold" text-anchor="middle">🌱 VEGETATION</text>

      <rect x="284" y="0" width="140" height="28" rx="14" fill="#1f2d42" stroke="#f15bb5" stroke-width="1" />
      <text x="354" y="18" font-family="sans-serif" font-size="12" fill="#f15bb5" font-weight="bold" text-anchor="middle">🔍 CHANGE DETECT</text>
    </g>
  </g>
</svg>
